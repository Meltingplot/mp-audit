# The project's metadata and the configuration of its tools. Nothing is built
# from this: the image takes overlay/ as it is, at the commit it pins, and a tag
# on that commit is the release. The version here and that tag, v<version>, go
# together (see CONTRIBUTING.md).

[project]
name = "mp-audit"
version = "0.1.0"
description = "The audit log of the Meltingplot printer computers"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["cryptography"]

[project.urls]
Repository = "https://github.com/Meltingplot/mp-audit"

[tool.ruff]
line-length = 120
# The service and the tool have no file extension.
extend-include = ["overlay/usr/bin/mp-audit", "overlay/usr/lib/meltingplot/mp-audit/mp-auditd"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # import order
    "B",      # likely bugs
    "UP",     # outdated syntax
    "BLE",    # blind except
    "C4",     # comprehensions
    "PIE",    # needless code
    "S",      # security
    "SIM",    # simpler forms
    "C90",    # complexity of a function
    "PL",     # pylint: size of a function, its arguments and returns, magic values
    "RUF100", # noqa comments that do nothing
]
ignore = [
    "S603",  # the service runs fixed system tools (blkid, mkfs.ext4, e2fsck, chattr) with fixed arguments
    "S607",  # by name, found through PATH as the unit sets it
]

[tool.ruff.lint.isort]
known-first-party = ["auditcore", "auditlog"]

[tool.ruff.lint.per-file-ignores]
# The image build imports auditcore, and with it this file, to read SHARES. That
# must not need cryptography, so it is imported where it is used.
"overlay/usr/lib/meltingplot/mp-audit/auditlog.py" = ["PLC0415"]
# The tests run on a build host, on temporary directories, with their own stubs,
# and compare with the numbers they expect.
"test/*" = ["S101", "S103", "S108", "PLR2004"]
